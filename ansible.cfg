[defaults]
inventory = inv
roles_path = roles

use_persistent_connections = True
timeout = 30
no_target_syslog = True
retry_files_enabled = False
forks = 8

gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts
fact_caching_timeout = 604800

[inventory]
cache = True

[privilege_escalation]
become = True

[connection]
pipelining = True

[ssh_connection]
pipelining = True
